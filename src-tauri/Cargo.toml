[package]
name = "open-presenter"
version = "1.0.0"
description = "Altaris Presenter - Software livre de projeção e transmissão para igrejas"
authors = ["Jonathas"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "sync", "rt-multi-thread"] }
rusqlite = { version = "0.31", features = ["bundled"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
