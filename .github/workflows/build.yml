name: Compilar Altaris Presenter (Electron Multiplataforma)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Compilar Executáveis Linux (.AppImage e .flatpak)
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências Node
        run: npm install

      - name: Compilar AppImage (Electron)
        run: |
          npm run build:electron
          npx electron-builder --linux appimage --dir --publish never

      - name: Instalar dependências Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Gerar Pacote Linux (.flatpak)
        run: |
          cd flatpak
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --repo=repo --force-clean build-dir org.altaris.Altaris.yml
          flatpak build-bundle repo ../Altaris-1.0.0.flatpak org.altaris.Altaris
          cd ..

      - name: Salvar Binários Linux como Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Altaris-Linux-Packages
          path: |
            dist-electron/*.AppImage
            Altaris-1.0.0.flatpak

      - name: Limpar Pacotes Obsoletos da Release
        run: |
          gh release view v1.0.0 --json assets -q ".assets[] | select(.name | test("\\.deb$|\\.msi$|x86_64\\.AppImage$|Altaris_1.0.0_amd64.AppImage$")) | .name" 2>/dev/null | while read -r asset; do
            if [ -n "$asset" ]; then
              echo "Removendo pacote antigo/obsoleto: $asset"
              gh release delete-asset v1.0.0 "$asset" -y || true
            fi
          done || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Binários Linux na Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Altaris Presenter v1.0.0"
          files: |
            dist-electron/*.AppImage
            Altaris-1.0.0.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Compilar Executável Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar Instalador Windows (.exe)
        run: npm run electron:build:win

      - name: Salvar Executável como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Altaris-Windows-Installer
          path: |
            dist-electron/*.exe

      - name: Limpar Instalador Windows Antigo da Release
        shell: bash
        run: |
          gh release view v1.0.0 --json assets -q ".assets[] | select(.name | test("x64-setup.exe$")) | .name" 2>/dev/null | while read -r asset; do
            if [ -n "$asset" ]; then
              echo "Removendo instalador antigo: $asset"
              gh release delete-asset v1.0.0 "$asset" -y || true
            fi
          done || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Executável na Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Altaris Presenter v1.0.0"
          files: |
            dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
