name: Compilar Altaris Presenter (Multiplataforma)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Compilar Executáveis Linux (.AppImage e .flatpak)
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências do sistema Linux e Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev flatpak flatpak-builder elfutils

      - name: Configurar ambiente Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar Pacote Linux (.AppImage)
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar Pacote Linux (.flatpak)
        run: |
          cd flatpak
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --repo=repo --force-clean build-dir org.altaris.Altaris.yml
          flatpak build-bundle repo ../Altaris-1.0.0.flatpak org.altaris.Altaris
          cd ..

      - name: Salvar Binários Linux como Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Altaris-Linux-Packages
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            Altaris-1.0.0.flatpak

      - name: Publicar Binários Linux na Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Altaris Presenter v1.0.0"
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            Altaris-1.0.0.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Compilar Executável Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar Instalador Windows (.exe)
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar Executável como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Altaris-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publicar Executável na Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Altaris Presenter v1.0.0"
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
