<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Altaris - Retorno de Palco</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <style>
    body {
      background: #05070c;
      color: #fff;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: 60px 1fr 120px;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      padding: 16px 24px;
      gap: 14px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .stage-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
      min-width: 0;
      gap: 12px;
    }
    #stage-slide-header {
      font-size: clamp(1.1rem, 2.2vw, 1.5rem);
      font-weight: 700;
      color: #a5b4fc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stage-clock {
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 800;
      color: #38bdf8;
      white-space: nowrap;
    }
    .stage-main-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 12px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .stage-current-lyrics {
      font-size: clamp(1.6rem, 3.8vw, 3.2rem);
      font-weight: 700;
      line-height: 1.32;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
      white-space: pre-line;
      max-width: 100%;
      overflow-wrap: break-word;
    }
    .stage-chords {
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(1.2rem, 2.6vw, 2.1rem);
      font-weight: 700;
      color: var(--stage-chord);
      margin-bottom: 14px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 4px 16px;
      border-radius: 8px;
      white-space: pre-line;
      max-width: 100%;
    }
    .stage-next-preview {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      overflow: hidden;
    }
    .stage-next-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stage-next-text {
      font-size: clamp(1rem, 2vw, 1.35rem);
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .stage-cp-banner {
      display: none;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border: 2px solid #fca5a5;
      color: #fff;
      font-size: clamp(1.2rem, 2.5vw, 2rem);
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.7);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      max-width: 100%;
    }
    .stage-window-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stage-ctrl-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .stage-ctrl-btn:hover {
      background: rgba(239, 68, 68, 0.8);
      color: #fff;
    }
    @keyframes stage-flash-anim {
      0%, 100% { background-color: #05070c; }
      50% { background-color: #b91c1c; }
    }
    body.flash-attention {
      animation: stage-flash-anim 0.45s ease-in-out 5;
    }
  </style>
</head>
<body>
  <div class="stage-top-bar">
    <div id="stage-slide-header">RETORNO DE PALCO</div>
    <div style="display: flex; align-items: center; gap: 14px; flex-shrink: 0;">
      <div id="stage-countdown" style="display: none; font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 800; color: #fbbf24; background: rgba(251, 191, 36, 0.15); padding: 2px 12px; border-radius: 8px; border: 1px solid rgba(251, 191, 36, 0.4);">00:00</div>
      <div class="stage-clock" id="stage-clock">00:00:00</div>
      <div class="stage-window-controls">
        <button id="btn-stage-fullscreen" class="stage-ctrl-btn" title="Alternar Tela Cheia (F11)">⛶ Tela Cheia</button>
        <button id="btn-stage-close" class="stage-ctrl-btn" title="Fechar Retorno de Palco (Esc / F6)">✕ Fechar</button>
      </div>
    </div>
  </div>

  <div class="stage-main-text">
    <div id="stage-cp-banner" class="stage-cp-banner"></div>
    <div class="stage-chords" id="stage-chords" style="display: none;"></div>
    <div class="stage-current-lyrics" id="stage-lyrics">Aguardando início...</div>
  </div>

  <div class="stage-next-preview">
    <div class="stage-next-label">Próximo Slide</div>
    <div class="stage-next-text" id="stage-next">Fim da apresentação</div>
  </div>

  <script type="module" src="/src/ts/stage.ts"></script>
</body>
</html>
