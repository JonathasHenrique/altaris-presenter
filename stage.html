<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OpenPresenter - Retorno de Palco</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <style>
    body {
      background: #000;
      color: #fff;
      display: grid;
      grid-template-rows: 60px 1fr 140px;
      height: 100vh;
      padding: 16px;
      gap: 16px;
    }
    .stage-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
    }
    .stage-clock {
      font-family: "JetBrains Mono", monospace;
      font-size: 2.2rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .stage-main-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .stage-current-lyrics {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
      white-space: pre-line;
    }
    .stage-chords {
      font-family: "JetBrains Mono", monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--stage-chord);
      margin-bottom: 16px;
      background: rgba(251, 191, 36, 0.1);
      padding: 4px 16px;
      border-radius: 8px;
      white-space: pre-line;
    }
    .stage-next-preview {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stage-next-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stage-next-text {
      font-size: 1.4rem;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="stage-top-bar">
    <div style="font-size: 1.4rem; font-weight: 700; color: #a5b4fc;" id="stage-slide-header">RETORNO DE PALCO</div>
    <div class="stage-clock" id="stage-clock">00:00:00</div>
  </div>

  <div class="stage-main-text">
    <div class="stage-chords" id="stage-chords"></div>
    <div class="stage-current-lyrics" id="stage-lyrics">Aguardando início...</div>
  </div>

  <div class="stage-next-preview">
    <div class="stage-next-label">Próximo Slide</div>
    <div class="stage-next-text" id="stage-next">Fim da apresentação</div>
  </div>

  <script type="module" src="/src/ts/stage.ts"></script>
</body>
</html>
