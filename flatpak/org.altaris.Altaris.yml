app-id: org.altaris.Altaris
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
command: altaris

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=home

modules:
  - name: altaris
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/applications /app/share/icons/hicolor/128x128/apps /app/opt/altaris
      - cp -a ./* /app/opt/altaris/
      - install -Dm755 altaris-wrapper.sh /app/bin/altaris
      - install -Dm644 org.altaris.Altaris.desktop /app/share/applications/org.altaris.Altaris.desktop
      - install -Dm644 org.altaris.Altaris.png /app/share/icons/hicolor/128x128/apps/org.altaris.Altaris.png
    sources:
      - type: dir
        path: ../dist-electron/linux-unpacked
      - type: file
        path: altaris-wrapper.sh
      - type: file
        path: org.altaris.Altaris.desktop
      - type: file
        path: ../public/icons/128x128.png
        dest-filename: org.altaris.Altaris.png
